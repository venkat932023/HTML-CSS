<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Food Menu</title>

    <style>
        #restaurantName {
            color: red;
        }

        .orderButton {
            color: white;
            background-color: green;
        }

        .menu {
            border: 2px solid black;
            text-align: center;
            width: 400px;
            height: 330px;
            margin: 100px;
        }
    </style>
</head>

<body>

    <div class="menu">

        <h1 id="restaurantName">ABC Restaurant</h1>

        <h2>Today's Menu</h2>

        <p>Pizza - ₹200</p>
        <p>Burger - ₹150</p>
        <p>Pasta - ₹180</p>
        <p>Biryani - ₹250</p>
        <p>Fried Rice - ₹120</p>

        <button class="orderButton">Order Now</button>

    </div>

</body>
</html>
