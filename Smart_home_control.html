<!DOCTYPE html>
<html>
<head>
    <title>Smart Home Control Panel</title>

    <style>
        #homeTitle {
            color: blue;
        }

        .home {
            border: 2px solid black;
            text-align: center;
            width: 400px;
            height: 550px;
            margin: 100px;
        }

        button {
            color: white;
            background-color: green;
        }
    </style>
</head>

<body>

    <div class="home">

        <h1 id="homeTitle">SMART HOME</h1>

        <h2>Control Panel</h2>

        <p>Living Room Light</p>
        <p>Status: ON</p>

        <p>AC</p>
        <p>Status: OFF</p>

        <p>Television</p>
        <p>Status: ON</p>

        <p>Main Door</p>
        <p>Status: LOCKED</p>

        <p>Room Temperature: 24°C</p>
        <p>WiFi: Connected</p>
        <p>Backup: 85%</p>

        <button>Control Home</button>

    </div>

</body>
</html>
